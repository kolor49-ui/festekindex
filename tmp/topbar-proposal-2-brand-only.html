<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topbar javaslat 2 — brand only (centered)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
      background: #dde3e8;
      color: #0d1520;
    }
    .label {
      padding: 14px 16px 8px;
      font-size: 12px;
      color: #5a6a76;
    }
    .label strong { color: #0d1520; display: block; font-size: 15px; margin-bottom: 2px; }
    .phone {
      width: 390px;
      max-width: 100%;
      margin: 0 auto 24px;
      background: #fff;
      border: 1px solid #c5d0d8;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(14,25,35,0.1);
    }
    .status {
      height: 28px;
      background: #f0f3f5;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      color: #333;
      font-weight: 600;
    }
    /* 3-col grid: menu | centered brand | spacer (balances the menu) */
    .topbar {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      column-gap: 8px;
      min-height: 56px;
      padding: 8px 12px;
      border-bottom: 1px solid #dce3e8;
      background: #f7f9fb;
    }
    .menu {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 6px;
      background: #15212b;
      color: #fff;
      font-size: 16px;
      justify-self: start;
    }
    .scope {
      justify-self: center;
      min-width: 0;
      max-width: 100%;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #15212b;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    .brand em {
      font-style: normal;
      color: #1d6f9f;
    }
    .mark {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid #cfd8df;
      background: #fff;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      padding: 2px;
      flex-shrink: 0;
    }
    .mark i { display: block; border-radius: 2px; }
    .mark i:nth-child(1) { background: #e24b3b; }
    .mark i:nth-child(2) { background: #f0b429; }
    .mark i:nth-child(3) { background: #2f9e6b; }
    .mark i:nth-child(4) { background: #1c79b4; }
    .spacer { width: 36px; height: 36px; justify-self: end; }
    .note {
      padding: 10px 16px 0;
      font-size: 11px;
      color: #667683;
      text-align: center;
      max-width: 390px;
      margin: 0 auto;
    }
    .content { height: 120px; background: #eef2f5; }
  </style>
</head>
<body>
  <div class="label">
    <strong>2 — Brand only (középre)</strong>
    Mark + név a topbar közepén · hamburger balra, jobb oldalon egyensúly-spacer · nincs tagline
  </div>
  <div class="phone">
    <div class="status"><span>15:56</span><span>▮▮▮</span></div>
    <header class="topbar">
      <button class="menu" type="button" aria-label="Menü">☰</button>
      <div class="scope">
        <a class="brand" href="#">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span>FESTÉK<em>INDEX</em></span>
        </a>
      </div>
      <div class="spacer" aria-hidden="true"></div>
    </header>
    <div class="content"></div>
  </div>
  <p class="note">A brand vizuálisan középen van (a jobb spacer kiegyenlíti a hamburger szélességét), nem ragad a menühöz.</p>
</body>
</html>
