<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topbar javaslat 1 — stacked</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
      background: #dde3e8;
      color: #0d1520;
    }
    .label {
      padding: 14px 16px 8px;
      font-size: 12px;
      color: #5a6a76;
    }
    .label strong { color: #0d1520; display: block; font-size: 15px; margin-bottom: 2px; }
    .phone {
      width: 390px;
      max-width: 100%;
      margin: 0 auto 24px;
      background: #fff;
      border: 1px solid #c5d0d8;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(14,25,35,0.1);
    }
    .status {
      height: 28px;
      background: #f0f3f5;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      color: #333;
      font-weight: 600;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 8px 14px;
      border-bottom: 1px solid #dce3e8;
      background: #f7f9fb;
    }
    .menu {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 6px;
      background: #15212b;
      color: #fff;
      font-size: 16px;
      flex-shrink: 0;
    }
    .scope {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      justify-content: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #1d6f9f;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .mark {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 1px solid #cfd8df;
      background: #fff;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      padding: 2px;
      flex-shrink: 0;
    }
    .mark i { display: block; border-radius: 1.5px; }
    .mark i:nth-child(1) { background: #e24b3b; }
    .mark i:nth-child(2) { background: #f0b429; }
    .mark i:nth-child(3) { background: #2f9e6b; }
    .mark i:nth-child(4) { background: #1c79b4; }
    .tag {
      margin-left: 30px;
      font-size: 10px;
      color: #71808c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .content { height: 120px; background: #eef2f5; }
  </style>
</head>
<body>
  <div class="label">
    <strong>1 — Stacked</strong>
    Mark + név egy sor · tagline alatta, a markhoz igazítva
  </div>
  <div class="phone">
    <div class="status"><span>15:56</span><span>▮▮▮</span></div>
    <header class="topbar">
      <button class="menu" type="button" aria-label="Menü">☰</button>
      <div class="scope">
        <a class="brand" href="#">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span>FESTÉKINDEX</span>
        </a>
        <div class="tag">A festékipar szakmai indexe</div>
      </div>
    </header>
    <div class="content"></div>
  </div>
</body>
</html>
